name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cache Buildozer and Android SDK
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          .buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    # 1. تثبيت حزم النظام الشاملة لـ Ubuntu 22.04 لمنع أي نقص
    - name: Install complete system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y -qq \
          build-essential ccache git libffi-dev libssl-dev python3-dev zip unzip \
          openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
          libncursesw5-dev libsqlite3-dev cmake gettext libtinfo5

    - name: Install exact Python tools
      run: |
        python -m pip install --upgrade "pip<24.1" "setuptools<69.0.0" wheel
        pip install "cython==0.29.36"
        pip install "buildozer==1.5.0"

    # 2. إنشاء buildozer.spec وتعديله بشكل صريح ومضمون
    - name: Prepare buildozer.spec safely
      run: |
        if [ ! -f buildozer.spec ]; then
          buildozer init
        fi
        
        # استخدام مرونة أكبر في sed للتعامل مع المسافات
        sed -i -E 's/^#?[[:space:]]*requirements[[:space:]]*=.*/requirements = python3==3.10.12,kivy==2.2.1/g' buildozer.spec
        sed -i -E 's/^#?[[:space:]]*android.accept_sdk_license[[:space:]]*=.*/android.accept_sdk_license = True/g' buildozer.spec
        sed -i -E 's/^#?[[:space:]]*android.archs[[:space:]]*=.*/android.archs = arm64-v8a/g' buildozer.spec
        sed -i -E 's/^#?[[:space:]]*android.ndk[[:space:]]*=.*/android.ndk = 25b/g' buildozer.spec
        
        # تجهيز مجلدات الترخيص تلقائياً
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg

    - name: Build APK
      run: |
        export PATH=$PATH:~/.local/bin
        yes | buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: bin/*.apk
