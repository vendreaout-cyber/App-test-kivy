name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install complete system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y -qq \
          build-essential ccache git libffi-dev libssl-dev python3-dev zip unzip \
          openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
          libncursesw5-dev libsqlite3-dev cmake gettext libtinfo5

    - name: Install exact Python tools
      run: |
        python -m pip install --upgrade "pip<24.1" "setuptools<69.0.0" wheel
        pip install "cython==0.29.36"
        pip install "buildozer==1.5.0"

    - name: Prepare buildozer.spec safely
      run: |
        if [ ! -f buildozer.spec ]; then
          buildozer init
        fi
        
        # ضبط التبعيات وتحديد NDK 25b صراحة لتفادي r28c
        sed -i -E 's/^#?[[:space:]]*requirements[[:space:]]*=.*/requirements = python3,kivy==2.2.1/g' buildozer.spec
        sed -i -E 's/^#?[[:space:]]*android.accept_sdk_license[[:space:]]*=.*/android.accept_sdk_license = True/g' buildozer.spec
        sed -i -E 's/^#?[[:space:]]*android.archs[[:space:]]*=.*/android.archs = arm64-v8a/g' buildozer.spec
        sed -i -E 's/^#?[[:space:]]*android.ndk_path[[:space:]]*=.*/# android.ndk_path =/g' buildozer.spec
        sed -i -E 's/^#?[[:space:]]*android.ndk[[:space:]]*=.*/android.ndk = 25b/g' buildozer.spec
        sed -i -E 's/^#?[[:space:]]*android.ndk_version[[:space:]]*=.*/android.ndk_version = 25b/g' buildozer.spec
        
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg

    - name: Build APK
      run: |
        export PATH=$PATH:~/.local/bin
        yes | buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: bin/*.apk
